name: CD - Build & Push to Docker Hub

on:
  push:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------
  # JOB 1: CI — build containers, ch?y healthcheck, test CRUD
  # ----------------------------------------------------------------------
  ci:
    name: CI - Build & Health & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for MongoDB to be healthy
        run: |
          echo "Waiting for MongoDB healthcheck..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb 2>/dev/null || echo "starting")
            echo "  attempt $i: MongoDB = $STATUS"
            [ "$STATUS" = "healthy" ] && echo "MongoDB is healthy!" && break
            sleep 5
          done

      - name: Wait for Product API to be healthy
        run: |
          echo "Waiting for Product API healthcheck..."
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api 2>/dev/null || echo "starting")
            echo "  attempt $i: product-api = $STATUS"
            [ "$STATUS" = "healthy" ] && echo "Product API is healthy!" && break
            sleep 5
          done

      - name: Show container status
        run: docker compose ps

      - name: Run CRUD tests inside container
        run: |
          docker exec \
            -e PRODUCT_SERVICE_URL=http://localhost:3001 \
            product-api npm test

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # ----------------------------------------------------------------------
  # JOB 2: CD — ch? ch?y khi CI pass, push image lên Docker Hub
  # ----------------------------------------------------------------------
  push-to-dockerhub:
    name: CD - Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push product-api image
        uses: docker/build-push-action@v5
        with:
          context: ./product
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
