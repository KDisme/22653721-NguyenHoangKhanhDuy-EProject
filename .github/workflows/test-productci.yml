name: CI - Product API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test Product API
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── 2. Build Docker images ───────────────────────────────────────
      - name: Build Docker images
        run: docker compose build

      # ── 3. Start containers ──────────────────────────────────────────
      - name: Start containers
        run: docker compose up -d

      # ── 4. Wait for services to be healthy ───────────────────────────
      - name: Wait for MongoDB to be healthy
        run: |
          echo "Waiting for MongoDB healthcheck..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb 2>/dev/null || echo "starting")
            echo "  attempt $i: MongoDB = $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "MongoDB is healthy!"
              break
            fi
            sleep 5
          done

      - name: Wait for Product API to be healthy
        run: |
          echo "Waiting for Product API healthcheck..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api 2>/dev/null || echo "starting")
            echo "  attempt $i: product-api = $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Product API is healthy!"
              break
            fi
            sleep 5
          done

      # ── 5. Show container status ─────────────────────────────────────
      - name: Show container status
        run: docker compose ps

      # ── 6. Run CRUD tests inside container ───────────────────────────
      - name: Run CRUD tests
        run: |
          docker exec \
            -e PRODUCT_SERVICE_URL=http://localhost:3001 \
            product-api npm test

      # ── 7. Show product-api logs if test fails ───────────────────────
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      # ── 8. Cleanup ───────────────────────────────────────────────────
      - name: Stop and remove containers
        if: always()
        run: docker compose down -v
